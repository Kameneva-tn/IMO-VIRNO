# /etc/nginx/sites-available/imo-virno
server {
    listen 80;
    listen [::]:80;
    server_name imo-virno.com.ua www.imo-virno.com.ua;   # ← свій домен або _ для доступу по IP

    root /var/www/imo-virno;
    index index.html;
    charset utf-8;

    client_max_body_size 64m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # приймання замовлень → сервіс imo-virno-api
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /admin/index.html;
    }

    location /assets/img/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/data/ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
